<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JNuNu</title>
<meta name="description" content="게을러지기 위해 노력하는 개발자">
<meta property="og:title" content="JNuNu">
<meta property="og:description" content="게을러지기 위해 노력하는 개발자">
<style>
:root {
  --canvas: #fffaf0;
  --navy:   #0d1919;
  --white:  #ffffff;
  --ink:    #0a0a0a;
  --muted:  #706a62;
  --green:  #3db368;
  --terra:  #c9785a;
  --teal:   #6fb0a8;
}

*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  background: var(--canvas);
  color: var(--ink);
  font-family: Inter, 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 56px 28px 44px;
  overflow-x: hidden;
  position: relative;
}

/* ── Organic clay blobs ────────────────────────── */
.blobs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.blob {
  position: absolute;
}

/* Terracotta — top, leans right */
.b-terra-top {
  width: 340px;
  height: 460px;
  background: var(--terra);
  opacity: 0.38;
  top: -140px;
  left: calc(50% - 80px);
  border-radius: 62% 38% 28% 72% / 58% 32% 68% 42%;
  transform: rotate(-32deg);
}

/* Teal — bottom, leans left */
.b-teal-bot {
  width: 280px;
  height: 370px;
  background: var(--teal);
  opacity: 0.34;
  bottom: -100px;
  right: calc(50% + 10px);
  border-radius: 38% 62% 68% 32% / 52% 36% 64% 48%;
  transform: rotate(22deg);
}

/* Small terra — bottom right accent */
.b-terra-bot {
  width: 200px;
  height: 260px;
  background: var(--terra);
  opacity: 0.22;
  bottom: 20px;
  left: calc(50% + 90px);
  border-radius: 52% 48% 42% 58% / 44% 58% 42% 56%;
  transform: rotate(-14deg);
}

/* ── Page content ──────────────────────────────── */
.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Profile ───────────────────────────────────── */
.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 36px;
}

.avatar {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
  flex-shrink: 0;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.name {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--ink);
}

.bio {
  font-size: 13.5px;
  color: var(--muted);
  text-align: center;
  line-height: 1.55;
}

/* ── Link buttons ──────────────────────────────── */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 30px;
}

.btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 20px;
  border-radius: 16px;
  background: rgba(255,255,255,0.88);
  border: 1px solid rgba(255,255,255,0.96);
  box-shadow: 0 2px 14px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
  text-decoration: none;
  color: var(--ink);
  transition: box-shadow 0.16s ease, transform 0.13s ease;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.btn:hover {
  box-shadow: 0 6px 24px rgba(0,0,0,0.11), 0 2px 6px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.btn:active      { transform: translateY(0); opacity: 0.85; }
.btn:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}

.btn-icon-img {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  flex-shrink: 0;
  object-fit: cover;
  display: block;
}

.btn-text {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.btn-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
}

.btn-sub {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
}

.btn-arr {
  font-size: 15px;
  color: #b0a898;
  flex-shrink: 0;
  transition: transform 0.13s ease, color 0.13s ease;
}

.btn:hover .btn-arr {
  transform: translateX(3px);
  color: var(--ink);
}

/* ── Social icons ──────────────────────────────── */
.socials {
  display: flex;
  align-items: center;
  gap: 24px;
}

.soc {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  opacity: 0.55;
  text-decoration: none;
  transition: opacity 0.14s ease;
  -webkit-tap-highlight-color: transparent;
}

.soc:hover       { opacity: 1; }
.soc:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ── Footer ────────────────────────────────────── */
.footer {
  margin-top: 36px;
  font-size: 11px;
  color: var(--muted);
  opacity: 0.45;
  letter-spacing: 0.04em;
}

/* ── Entry animation ───────────────────────────── */
@media (prefers-reduced-motion: no-preference) {
  .page {
    animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
}
</style>
</head>
