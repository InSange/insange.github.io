<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core Tree Support</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --page: #070d18; --panel: #13213a; --edge: #22375c; --well: #0a1220; --inner: #0f1a2e;
    --text: #f4f7ff; --dim: #9fb0cf; --soft: #6c7a98; --buy: #2bb673; --buy-d: #1c8a55; --accent: #5cf2d6; --warn: #ff5c7a;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--page); color: var(--text); font-family: var(--body); }
  body { padding-inline: 16px; padding-block: max(24px, env(safe-area-inset-top)) 40px; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--accent); display: grid; place-items: center; flex: none; }
  .logo::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.15; }
  header p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
  form, .done { background: var(--panel); border: 3px solid var(--edge); border-radius: 22px; padding: 18px 16px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; font-weight: 700; }
  label small { font-weight: 500; color: var(--dim); font-size: 12px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 15px; color: var(--text); background: var(--well); border: 2px solid var(--inner); border-radius: 12px; padding: 11px 12px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .uid { font-family: ui-monospace, Menlo, monospace; color: var(--dim); background: var(--inner); border-radius: 12px; padding: 11px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .uid b { color: var(--text); font-weight: 500; }
  button { font-family: var(--display); font-size: 19px; color: #fff; background: var(--buy); border: 0; border-radius: 14px; padding: 13px; box-shadow: 0 4px 0 var(--buy-d); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .note { color: var(--soft); font-size: 12px; line-height: 1.6; margin: 0; }
  .note a { color: var(--accent); }
  .err { color: var(--warn); font-size: 13px; margin: 0; min-height: 1em; }
  .done h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
  .done p { margin: 0; color: var(--dim); line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1 data-t="title">코어 트리 문의</h1>
      <p data-t="sub">Core Tree: Cell Defense</p>
    </div>
  </header>

  <form id="f" novalidate>
    <label><span data-t="uid">유저 ID</span>
      <div class="uid"><b id="uidShow">-</b><span id="uidNote" data-t="uidAuto">게임에서 자동 입력</span></div>
    </label>
    <label id="nameRow" hidden><span data-t="who">Play 게임즈 이름 또는 별명</span>
      <small data-t="whoNote">게임을 지웠다면 본인 확인을 위해 적어 주세요</small>
      <input id="who" maxlength="40" autocomplete="off">
    </label>
    <label for="cat"><span data-t="cat">항목</span>
      <select id="cat" required>
        <option value="" data-t="catPick">선택</option>
        <option value="payment" data-t="catPay">결제</option>
        <option value="bug" data-t="catBug">버그</option>
        <option value="account" data-t="catAcc">계정과 진행</option>
        <option value="delete-account" data-t="catDelAcc">계정과 데이터 삭제 요청</option>
        <option value="delete-data" data-t="catDelData">진행 데이터만 삭제 요청</option>
        <option value="other" data-t="catEtc">기타</option>
      </select>
    </label>
    <label><span data-t="subject">제목</span>
      <input id="subject" maxlength="80" required>
    </label>
    <label><span data-t="body">문의 내용</span>
      <small id="payHint" data-t="payHint" hidden>결제 문의는 Google Play 주문번호(GPA로 시작)를 함께 적어 주세요</small>
      <textarea id="body" maxlength="3000" required></textarea>
    </label>
    <label><span data-t="email">답장 받을 이메일</span>
      <small data-t="emailNote">선택, 답이 필요할 때만</small>
      <input id="email" type="email" maxlength="120" autocomplete="email">
    </label>
    <p class="err" id="err" role="alert"></p>
    <button id="send" type="submit" data-t="send">보내기</button>
    <p class="note"><span data-t="privacy">보낸 내용은 문의 처리에만 쓰고, 처리 뒤 90일이 지나면 지웁니다.</span> <a id="pp" href="https://insange.github.io/cell-pulse-privacy/" data-t="pp">개인정보 처리방침</a></p>
  </form>

  <section class="done" id="done" hidden>
    <h2 data-t="doneTitle">접수됨</h2>
    <p data-t="doneBody">문의를 받았습니다. 이메일을 남겼다면 그 주소로 답장합니다.</p>
  </section>
</main>

    pt: { title: "Suporte do Core Tree", uid: "ID do usuário", uidAuto: "Preenchido pelo jogo", uidNone: "Nenhum, aberto fora do jogo", who: "Nome do Play Games ou apelido", whoNote: "Se você apagou o jogo, informe para verificarmos você", cat: "Assunto", catPick: "Escolher", catPay: "Pagamento", catBug: "Erro", catAcc: "Conta e progresso", catDelAcc: "Excluir minha conta e dados", catDelData: "Excluir só meu progresso", catEtc: "Outro", subject: "Título", body: "Mensagem", payHint: "Para pagamentos, informe o número do pedido do Google Play (começa com GPA)", email: "E-mail para resposta", emailNote: "Opcional, só se precisar de resposta", send: "Enviar", sending: "Enviando", privacy: "Usamos só para atender seu pedido e excluímos 90 dias depois.", pp: "Política de privacidade", doneTitle: "Recebido", doneBody: "Recebemos sua mensagem. Se deixou um e-mail, responderemos por lá.", errFill: "Preencha o assunto, o título e a mensagem", errMail: "Confira o e-mail", errSend: "Não foi possível enviar. Verifique a conexão e tente de novo" },

  var lang = q.get("lang") || (navigator.language || "en");
  if (!T[lang]) lang = /^zh/.test(lang) ? (/(TW|HK|Hant)/i.test(lang) ? "zh-Hant" : "zh-Hans") : lang.slice(0, 2);
  if (!T[lang]) lang = "en";
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(function (el) { var k = el.getAttribute("data-t"); if (t[k]) el.textContent = t[k]; });
  document.getElementById("pp").href = "https://insange.github.io/cell-pulse-privacy/?lang=" + lang;

    var who = document.getElementById("who").value.trim();
    if (!cat.value || !subject || !body) { err.textContent = t.errFill; return; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = t.errMail; return; }
    var d = new FormData();

</html>
